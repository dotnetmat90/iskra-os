# Iskra's desktop shell on Orbital (DESIGN.md): iskra-greeter (login screen, replaces orblogin)
# and iskra-panel (floating panel + Super+Space command bar, replaces launcher).
[package]
description = "Iskra greeter, panel and command bar"
dependencies = ["font-inter"]

[build]
template = "custom"
script = """
"${COOKBOOK_CARGO}" install --path "${COOKBOOK_RECIPE}/crate" --root "${COOKBOOK_STAGE}/usr" \
    --target-dir "${COOKBOOK_BUILD}/target" ${install_flags}
"""
