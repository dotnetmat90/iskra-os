[source]
tar = "https://archive.xfce.org/src/xfce/libxfce4ui/4.21/libxfce4ui-4.21.4.tar.xz"
blake3 = "30213bc2882d8e9c57c66532bf4d4f8bb57d18a2036ada7dcc5d4655abf45bd0"

[build]
dependencies = [
    "atk",
    "cairo",
    "expat",
    "fontconfig",
    "freetype2",
    "fribidi",
    "gdk-pixbuf",
    "gettext",
    "glib",
    "gtk3",
    "harfbuzz",
    "libepoxy",
    "libffi",
    "libiconv",
    "libjpeg",
    "libpng",
    "libpthread-stubs",
    "libx11",
    "libxau",
    "libxcb",
    "libxext",
    "libxfce4util",
    "libxfixes",
    "libxft",
    "libxi",
    "libxrandr",
    "libxrender",
    "libxxf86vm",
    "mesa-x11",
    "pango",
    "pcre2",
    "pixman",
    "shared-mime-info",
    "x11proto",
    "xfconf",
    "zlib",
]
# 4.21.4 tarball does not bundle xdt-gen-visibility (from xfce4-dev-tools); use the copy
# shipped with xfconf, kept next to this recipe.
template = "custom"
script = """
DYNAMIC_INIT
export PATH="${COOKBOOK_RECIPE}:${PATH}"
COOKBOOK_MESON_FLAGS+=(-Dintrospection=false)
cookbook_meson
"""
