[package]
description = "Orbital resources (images, fonts, etc)"

[source]
git = "https://gitlab.redox-os.org/redox-os/orbdata.git"

[build]
template = "custom"
script = """
cp -rv "${COOKBOOK_SOURCE}/"* "${COOKBOOK_STAGE}/"
# Iskra: branding/share mirrors /usr/share; its files replace upstream's (artwork, icons, theme).
ISKRA_SHARE="${COOKBOOK_RECIPE}/../../../branding/share"
if [ -d "${ISKRA_SHARE}" ]; then cp -rv "${ISKRA_SHARE}/." "${COOKBOOK_STAGE}/usr/share/"; fi
"""
