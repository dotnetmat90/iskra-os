[package]
description = "Orbital resources (images, fonts, etc)"

[source]
git = "https://gitlab.redox-os.org/redox-os/orbdata.git"

[build]
template = "custom"
script = """
cp -rv "${COOKBOOK_SOURCE}/"* "${COOKBOOK_STAGE}/"
# Iskra: replace UI artwork (wallpaper, login screen) with the fork's own.
ISKRA_UI="${COOKBOOK_RECIPE}/../../../branding/ui"
if [ -d "${ISKRA_UI}" ]; then cp -v "${ISKRA_UI}/"* "${COOKBOOK_STAGE}/usr/share/ui/"; fi
"""
