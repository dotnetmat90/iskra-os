# Hypervisor development image: Iskra with the kernel built from local, patched source.
#   recipes/iskra/kernel/prepare.sh      # puts the patched kernel at recipes/core/kernel/source
#   ISKRA_CONFIG=iskra-hv ./iskra.sh build
#   ISKRA_CONFIG=iskra-hv ISKRA_QEMU_CPU=EPYC ISKRA_BOOT_MARKER="iskra-svm: io exits: PASS" ./iskra.sh test
# QEMU emulates AMD SVM for the EPYC model, so this works without virtualization hardware.
# Inside: `grep iskra-svm /scheme/sys/log` (self-tests), `iskra-vmm-hello` and `iskra-vmm-timer` as root (userspace VMs).
# See ROADMAP.md, Phase 3.

include = ["iskra.toml"]

[packages]
kernel = "local"
# Userspace side of the hypervisor: iskra-vmm-hello (run as root).
iskra-vmm = "source"
