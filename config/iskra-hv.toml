# Hypervisor development image: Iskra with the kernel built from local, patched source.
#   recipes/iskra/kernel/prepare.sh      # puts the patched kernel at recipes/core/kernel/source
#   ISKRA_CONFIG=iskra-hv ./iskra.sh build
#   ISKRA_CONFIG=iskra-hv ISKRA_QEMU_CPU=EPYC ISKRA_BOOT_MARKER="iskra-svm: io exits: PASS" ./iskra.sh test
# QEMU emulates AMD SVM for the EPYC model, so this works without virtualization hardware.
# Inside: `grep iskra-svm /scheme/sys/log` (self-tests), `iskra-vmm-hello`, `iskra-vmm-timer`, `iskra-vmm-long`, `iskra-vmm-linux` as root (userspace VMs; the
# last boots Linux).
# PCI passthrough (hypervisor step 8) under QEMU's emulated AMD IOMMU: give QEMU, in front of
# its own flags, `-device amd-iommu -device virtio-serial-pci,disable-legacy=on,iommu_platform=on,
# id=vs,addr=0x10 -chardev file,id=hvc,path=/tmp/hvc.out -device virtconsole,chardev=hvc,bus=vs.0`
# (QEMU's virtio only honors the IOMMU with iommu_platform=on; its pvscsi reads descriptors past
# the IOMMU), then in Iskra: `iskra-vmm-linux --pass 00:10.0` and in Linux:
# `echo hi > /dev/hvc0` -> the text lands in /tmp/hvc.out on the QEMU host, via DMA through the IOMMU.
# See ROADMAP.md, Phase 3.

include = ["iskra.toml"]

[packages]
kernel = "local"
# Userspace side of the hypervisor: iskra-vmm-hello (run as root).
iskra-vmm = "source"
