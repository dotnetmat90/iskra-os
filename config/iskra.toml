# Iskra image: the upstream desktop plus Iskra identity.
# Iskra is an independent fork and is not affiliated with or endorsed by the Redox OS nonprofit.

include = ["desktop.toml"]

[general]
# Filesystem size in MiB (desktop default is 650; the browsers need the rest)
filesystem_size = 2048

[packages]
# Browsers beyond the desktop's NetSurf. Both are upstream work-in-progress recipes;
# upstream marks firefox "compiled, need testing".
firefox = {}
webkitgtk3 = {}
# Built locally so it picks up branding/ui (see recipes/gui/orbdata/recipe.toml).
orbdata = "source"

[[files]]
path = "/etc/hostname"
data = "iskra"

# Pre-login banner; replaces the one shipped in the userutils package.
[[files]]
path = "/etc/issue"
data = """
############ Iskra ############
# Based on Redox OS           #
# Login with the following:   #
# `user`                      #
# `root`:`password`           #
###############################

"""

# https://www.freedesktop.org/software/systemd/man/latest/os-release.html
[[files]]
path = "/usr/lib/os-release"
data = """
PRETTY_NAME="Iskra 0.1.0"
NAME="Iskra"
VERSION_ID="0.1.0"
VERSION="0.1.0"
ID="iskra"
ID_LIKE="redox-os"

HOME_URL="https://github.com/dotnetmat90/iskra-os"
"""
