# Iskra with the XFCE desktop (X11 running inside Orbital) instead of Orbital's own taskbar.
# NOT WORKING (tested 2026-11-25): X starts and draws (xterm shows), but xfwm4, xfce4-panel
# and xfdesktop exit immediately with no output. Kept as a record and for retesting after
# upstream updates; Iskra's desktop is built natively on Orbital instead (see PLAN.md).
# Build: ISKRA_CONFIG=iskra-xfce ./iskra.sh build

include = ["iskra.toml", "x11.toml"]

[general]
# Filesystem size in MiB: Iskra's 2048 plus room for X11, XFCE and GTK
filesystem_size = 4096

[packages]
# xfwl4 experiment: newer XFCE libraries than upstream publishes, built here.
libxfce4ui = "source"   # 4.21.4: keyboard-shortcut API xfwl4 uses
xfconf = "source"       # 4.21.2
xfwl4 = "source"

# Replaces upstream's session script: start the window manager, panel and desktop
# directly so each one's errors reach the boot log (xfce4-session hid xfwm4's failure).
[[files]]
path = "/usr/bin/xfce4-x11-session"
mode = 0o755
data = """
#!/usr/bin/env bash
set -x
gdk-pixbuf-query-loaders --update-cache
/usr/lib/xfce4/xfconf/xfconfd &
xfsettingsd &
command -v xfwm4 || echo "ISKRA: xfwm4 not installed"
xfwm4 &
sleep 15
echo "ISKRA: xfwm4 still running? $(kill -0 $! 2>&1 && echo yes || echo no)"
xfce4-panel --disable-wm-check &
xfdesktop &
exec xterm
"""
